name: Deploy to GitHub Pages

# 純靜態部署（BUILD_SPEC §0）：資料管線與 L2 生成在本機 build 期跑、產物 commit 進 data/；
# CI 只讀 data/ 做 astro build，無金鑰、不跑 LLM、不抽重資料源。
on:
  push:
    branches: [main]
  workflow_dispatch:
  # 每日重建：讓「今日一句」在台北換日後自動輪替，不依賴當天是否有新內容 push。
  # UTC 16:30 ＝台北 00:30；選句以台北時區年積日決定（site/src/lib/dailyVerse.ts）。
  schedule:
    - cron: '30 16 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 🔴 sitemap 的 lastmod 逐頁取 git commit 日期（見 site/astro.config.mjs 的 lastmodFor）。
          #    淺 clone 只有一個 commit，每個檔案的 git log 都會回同一天 —— 那等於每次部署
          #    都對 Google 宣稱全站更新，是假訊號，比沒有 lastmod 更糟。
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 只裝 site 及其相依（避開 pipeline 的 better-sqlite3 / onnxruntime 重原生套件）
      - name: Install site deps
        run: pnpm install --filter @tipitaka/site... --frozen-lockfile

      # 契約層（TEST_SPEC §1）：產物形狀 + 不變量；不過則 fail
      - name: Contract validation
        run: pnpm dlx tsx@4 scripts/validate-contract.ts

      - name: Golden regression (TEST_SPEC §2)
        run: pnpm dlx tsx@4 scripts/validate-golden.ts

      - name: Build site
        run: pnpm -C site build
        env:
          # 於 repo Settings → Secrets and variables → Actions → Variables 設定（皆為公開值，非機密）
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
          PUBLIC_GSC_VERIFICATION: ${{ vars.PUBLIC_GSC_VERIFICATION }}
          PUBLIC_L3_API: ${{ vars.PUBLIC_L3_API }}

      - name: Secret scan on artifacts (BUILD §4)
        run: pnpm dlx tsx@4 scripts/scan-secrets.ts

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 上線後把 sitemap URL 送 IndexNow（Bing/Yandex/Seznam/Naver 即時收錄；Google 不吃 IndexNow）。
  # 金鑰非機密（本就公開託管於 /<key>.txt），直接寫在 env。任何失敗 exit 0，不擋部署。
  # Astro 專案在子目錄 site/，故 working-directory 設 site。
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Submit sitemap URLs to IndexNow
        working-directory: site
        env:
          INDEXNOW_KEY: 97b3f5c3183fdf8efe7cb3cb0f3327b7
          SITE_URL: https://sutta.io
        run: node scripts/indexnow-submit.mjs

  # 任一階段 fail → 發 Slack 要求修改；修正 push 後 workflow 自動重跑＝重審（設計守門 v2）。
  # 需 repo secrets：SLACK_BOT_TOKEN、SLACK_CHANNEL_ID（缺則靜默略過，不 fail）。
  notify-failure:
    needs: [build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ] || [ -z "$SLACK_CHANNEL_ID" ]; then
            echo "Slack secrets not set; skip notify."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT="🚨 ${{ github.repository }} 部署被守門擋下（commit ${GITHUB_SHA::7}）。請修正設計規範/建置錯誤後 push，workflow 會自動重審。詳情： $RUN_URL"
          curl -sf -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-type: application/json; charset=utf-8' \
            -d "$(jq -n --arg ch "$SLACK_CHANNEL_ID" --arg t "$TEXT" '{channel:$ch,text:$t}')"
